# NOTE: This file is for reference and local dev/test only.
#
# The DEPLOYED inventory lives in the eightbitsaxlounge/server layer. The
# console Pi (1972-console-1) has /etc/ansible/hosts generated from:
#   server/templates/ansiblehosts.j2
#   server/group_vars/all/vars.yaml
#
# The [gpu_nodes] group is defined there. Playbooks in this repo are run
# FROM the console Pi and use that inventory — no separate hosts file needed.
#
# To re-deploy the inventory to the console Pi:
#   cd server && make init-console-config

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:

    # GPU node — PC running Linux (Ubuntu 24.04).
    # Same physical machine as the [midi] Windows host; separate ansible group
    # because the shell type, user, and workload are different.
    # IP is the same Ethernet DHCP reservation used for both OS boots.
    gpu_nodes:
      hosts:
        1972-gpu-1:
          ansible_host: 192.168.68.50
          ansible_user: mchellmer

    # CI/CD + Kubernetes master
    ci_nodes:
      hosts:
        1972-console-1:
          ansible_host: 192.168.68.201
          ansible_user: mchellmer

    # Kubernetes worker nodes
    rpi_nodes:
      hosts:
        1972-master-1:
          ansible_host: 192.168.68.202
          ansible_user: mchellmer
        1972-worker-1:
          ansible_host: 192.168.68.203
          ansible_user: mchellmer
        1972-worker-2:
          ansible_host: 192.168.68.204
          ansible_user: mchellmer
