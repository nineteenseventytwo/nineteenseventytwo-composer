name: composer

# No path filters. The required status check is named `test`, so a pull
# request that triggers neither workflow never reports one and blocks
# indefinitely — which is exactly what happened to the PR that changed only
# this file. Narrowing the filter to also match .github/workflows/** would fix
# that one case and leave a docs-only change stuck in the same way.
#
# The suite runs in about 25 seconds. Path filters were not buying enough to
# be worth a class of unmergeable pull request.
on:
  push:
    branches: [main]
  pull_request:

# Hosted runners only. A `pull_request` trigger on a public repo pointed at a
# self-hosted runner is a documented remote-code-execution path — a fork PR can
# run arbitrary code on a machine inside VLAN 20 — and is what ADR-0010 exists
# to prevent. The org's ARC scale sets are addressed by name (`lab-dind`,
# `lab-deploy`) rather than by the `self-hosted` label, so these jobs found no
# runner and never ran; that is an accident, not a control.
#
# arm64 because the cluster is arm64-only (ADR-0011), so this is also the
# architecture the image has to build for.

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install musicxml-tools
        run: pip install -e services/musicxml-tools

      - name: Install composer
        run: pip install -e "services/composer[dev]"

      - name: Lint
        run: ruff check services/composer/

      - name: Test
        run: pytest services/composer/

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat services/composer/version.txt)" >> "$GITHUB_OUTPUT"

      # Required before the build step, not optional. The runner's default
      # builder uses the `docker` driver, which cannot export a cache — the
      # GHA cache below fails it outright with "Cache export is not supported
      # for the docker driver". This sets up a `docker-container` driver,
      # which can. It passes locally without this because Docker Desktop
      # already provides such a builder.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 only, built natively on an arm64 runner. The cluster is
      # arm64-only (ADR-0011) and the GPU host runs Ollama's own image rather
      # than this one, so there is no second architecture to serve and no
      # reason to pay for emulation.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services
          file: services/composer/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/composer:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/composer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The platform repo pins every image by digest, so the thing it needs
      # from this job is the digest — not the tag it was pushed under. Printed
      # in the summary so updating apps/composer/dev/composer-deployment.yaml
      # is a copy rather than a `docker manifest inspect`.
      - name: Report the digest for the platform manifest
        run: |
          # An empty digest means the push silently did not happen, and the
          # platform repo would be handed a pin to nothing.
          test -n "${{ steps.build.outputs.digest }}" || {
            echo "::error::build produced no digest — the image was not pushed"
            exit 1
          }
          {
            echo "### composer ${{ steps.version.outputs.version }} published"
            echo
            echo '```yaml'
            echo "image: ghcr.io/${{ github.repository_owner }}/composer@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
