name: musicxml-tools

on:
  push:
    paths:
      - 'services/musicxml-tools/**'
    branches: [main]
  pull_request:
    paths:
      - 'services/musicxml-tools/**'

# Hosted runners only. A `pull_request` trigger on a public repo pointed at a
# self-hosted runner is a documented remote-code-execution path — a fork PR can
# run arbitrary code on a machine inside VLAN 20 — and is what ADR-0010 exists
# to prevent. The org's ARC scale sets are addressed by name (`lab-dind`,
# `lab-deploy`) rather than by the `self-hosted` label, so these jobs found no
# runner and never ran; that is an accident, not a control.
#
# arm64 because the cluster is arm64-only (ADR-0011), so this is also the
# architecture the image has to build for.

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: services/musicxml-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=musicxml_tools

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: services/musicxml-tools
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t musicxml-tools:${{ steps.version.outputs.version }} .
          docker tag musicxml-tools:${{ steps.version.outputs.version }} musicxml-tools:latest
