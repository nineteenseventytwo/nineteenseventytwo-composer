[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composer"
dynamic = ["version"]
description = "Bossa arrangement orchestration API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Declared by name, not by path. "@ file:///${PROJECT_ROOT}/../musicxml-tools"
    # is a PDM-ism — pip does not expand ${PROJECT_ROOT}, so it resolved to
    # /musicxml-tools and the install failed. The sibling package is installed
    # first by both CI and the Dockerfile, which leaves this satisfied.
    "musicxml-tools",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
