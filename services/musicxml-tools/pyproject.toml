[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "musicxml-tools"
dynamic = ["version"]
description = "MusicXML parsing, voice splitting, and score assembly for bossa arrangement"
requires-python = ">=3.12"
dependencies = [
    # Upper bound is deliberate. An unpinned floor is why the drum generator
    # sat broken (finding C14): music21 10 made `Unpitched.displayName`
    # read-only and nothing caught it, because CI pointed at a runner that no
    # longer existed (C9). Same lesson as eightbitsaxlounge's unpinned base
    # images — verify before widening.
    "music21>=10.5,<11",
    # Validates model output against the generated IR schema (schema.py).
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
